<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2575ff"><title>Kanban · Offline</title><style>*{box-sizing:border-box}body{font:14px system-ui,sans-serif;background:#f8f9fb;color:#222;margin:0;padding:24px}main{max-width:720px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;letter-spacing:-1px}p{color:#777;line-height:1.6}form,section{background:white;border:1px solid #e6e8ed;border-radius:16px;padding:16px;margin:16px 0}input,select,button{font:inherit;border:1px solid #ddd;border-radius:8px;padding:9px;background:white;color:inherit}input[type=text]{width:100%;margin-bottom:8px}button{cursor:pointer}#tasks button{width:100%;text-align:left;border:0;padding:12px 4px;border-bottom:1px solid #eee}#tasks span{color:#999;margin-left:8px}.actions{display:flex;gap:8px}a{color:#2575ff}@media(prefers-color-scheme:dark){body{background:#141519;color:#eee}form,section,input,select,button{background:#1c1d22;border-color:#34363e}}</style><main><header><h1>Kanban</h1><a href="/today">Reconnect →</a></header><p>You’re offline. Your last workspace is here; capture and complete tasks now, and they’ll sync when you reopen Kanban online.</p><form id="capture"><input id="title" type="text" maxlength="300" required placeholder="What’s on your mind?" aria-label="Task title"><div class="actions"><select id="board" aria-label="Board"></select><button>Add task</button></div></form><p id="status" role="status"></p><section id="tasks"></section></main><script>
const prefix='kanban:offline:',user=localStorage.getItem(prefix+'active'),key=kind=>prefix+user+':'+kind;let workspace;
try{workspace=JSON.parse(localStorage.getItem(key('workspace'))||'null');}catch{}
function queue(kind,data){const outbox=JSON.parse(localStorage.getItem(key('outbox'))||'[]');outbox.push({id:crypto.randomUUID(),kind,data});localStorage.setItem(key('outbox'),JSON.stringify(outbox));localStorage.setItem(key('workspace'),JSON.stringify(workspace));render();}
function render(){const target=document.getElementById('tasks');target.replaceChildren();document.getElementById('status').textContent=JSON.parse(localStorage.getItem(key('outbox'))||'[]').length+' changes waiting to sync';for(const task of workspace.tasks){const board=workspace.boards.find(b=>b.id===task.boardId),kind=board?.columns.find(c=>c.id===task.columnId)?.kind;if(['done','canceled','duplicated'].includes(kind)||task.completedAt)continue;const button=document.createElement('button');button.textContent='○ '+task.title;const label=document.createElement('span');label.textContent=board?.title||'';button.append(label);button.onclick=()=>{if(task.recurrence){document.getElementById('status').textContent='Recurring tasks can be completed after reconnecting.';return;}const column=board.columns.find(c=>c.kind==='done');const patch={completedAt:new Date().toISOString(),...(column?{columnId:column.id}:{}),focusOn:null};Object.assign(task,patch);queue('updateTask',{boardId:task.boardId,taskId:task.id,patch});};target.append(button);}}
if(!user||!workspace){document.getElementById('capture').hidden=true;document.getElementById('status').textContent='Open Kanban online once to save your workspace on this device.';}else{for(const b of workspace.boards){const option=document.createElement('option');option.value=b.id;option.textContent=b.title;document.getElementById('board').append(option);}render();document.getElementById('capture').onsubmit=e=>{e.preventDefault();const title=document.getElementById('title').value.trim(),board=workspace.boards.find(b=>b.id===document.getElementById('board').value);if(!title||!board)return;const column=board.columns.find(c=>c.kind==='todo')||board.columns[0];const task={id:crypto.randomUUID(),title,description:'',columnId:column.id,priority:'normal',assigneeIds:[],createdAt:new Date().toISOString(),dueDate:null,recurrence:null,completions:[],estimate:null,subtasks:[],goalId:null,snoozedUntil:null,focusOn:null,completedAt:null,scheduledStart:null,scheduledEnd:null,reminderAt:null,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone};workspace.tasks.push({...task,boardId:board.id});queue('createTasks',{boardId:board.id,tasks:[task]});document.getElementById('title').value='';};}
window.addEventListener('online',()=>location.replace('/today'));
</script></html>
